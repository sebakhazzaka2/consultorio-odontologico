# Nombre de proyecto fijo: containers (consultorio-odontologico-db-1, ...) y
# volúmenes (consultorio-odontologico_mysql_data, ...) no dependen de la carpeta
# donde se clonó el repo. Es el mismo nombre que Compose derivaba de la carpeta
# en neodental, así que reusa los volúmenes existentes. scripts/backup.sh y
# scripts/restore.sh asumen este nombre: si se cambia, cambiarlo también ahí.
name: consultorio-odontologico

services:

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: consultorio_db
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backups:/backups
    # Sin ports: MySQL solo accesible desde la red interna de Docker
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  backend:
    # IMAGE_TAG lo pasa el CI (SHA del commit); a mano, sin setear → :latest.
    image: ${GHCR_IMAGE_PREFIX}/consultorio-backend:${IMAGE_TAG:-latest}
    build: ./backend
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SENTRY_DSN: ${SENTRY_DSN:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      GOOGLE_PLACE_ID: ${GOOGLE_PLACE_ID:-}
    volumes:
      - uploads_data:/app/uploads
    # Sin ports: el backend solo es accesible desde Nginx en la red interna
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${GHCR_IMAGE_PREFIX}/consultorio-frontend:${IMAGE_TAG:-latest}
    build: ./frontend
    # Solo lo que usa 40-clinic-meta.sh (título y og:* del index.html).
    # No usar env_file: .env.prod acá — le pasaría secretos a nginx.
    environment:
      CLINIC_NOMBRE: ${CLINIC_NOMBRE:-}
      CLINIC_TAGLINE: ${CLINIC_TAGLINE:-}
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - uptime-kuma
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:1
    volumes:
      - kuma_data:/app/data
    restart: unless-stopped

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
  kuma_data:
  uploads_data:
