# Blueprint para la instancia demo de portfolio en Render.
# No reemplaza el deploy real (Hetzner + docker-compose.prod.yml) — es una instancia
# aparte, con datos ficticios, pensada para mostrarse en el portfolio.
#
# Requiere un MySQL externo gratuito (ej. Aiven) — Render no ofrece MySQL gestionado.
# Los envVars con "sync: false" se completan a mano en el dashboard de Render la
# primera vez que se crea el Blueprint.

services:
  - type: web
    name: consultorio-odontologico-demo-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/public/config
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Carga servicios/pacientes/citas ficticios en el primer arranque (una sola vez).
      - key: SEED_DEMO_DATA
        value: "true"
      # V5__add_foto_url_to_tratamientos.sql se reescribió como no-op el 2026-10-15
      # (duplicaba una columna ya presente en el baseline V1). Eso cambia su checksum
      # y rompe `flyway validate` en cualquier DB que ya tuviera V5 aplicada con el
      # checksum viejo — como esta instancia demo. No tenemos acceso a las credenciales
      # de Aiven desde el repo para correr `flyway repair`, así que desactivamos la
      # validación de checksum acá (solo en el demo; neodentalmaster no usa render.yaml).
      - key: SPRING_FLYWAY_VALIDATE_ON_MIGRATE
        value: "false"
      # Aiven free tier limita a 5 conexiones simultáneas por usuario. El default de
      # HikariCP (10) excede ese límite apenas arranca, y los redeploys fallidos
      # repetidos dejaban conexiones colgadas hasta agotarlo del todo
      # ("max_user_connections ... current value: 5"). 2 alcanza para esta app
      # de bajo tráfico (Flyway usa su propia conexión, separada del pool).
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "2"
      # Free tier de Render = 512MB RAM total. Sin esto el JVM sobreestima el heap
      # disponible y el proceso muere con OOM kill (exit 137). Override puntual —
      # no toca el Dockerfile real (Hetzner tiene otro perfil de memoria).
      - key: JAVA_TOOL_OPTIONS
        value: "-Dfile.encoding=UTF-8 -Xmx300m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC"
      # JDBC completo del MySQL externo (Aiven), con SSL requerido, ej:
      # jdbc:mysql://<host>:<port>/<db>?sslMode=REQUIRED&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # No se usa para conectar (SPRING_DATASOURCE_URL ya trae todo) pero
      # ConsultorioApplication.validateProdEnvVars() exige que exista y no esté vacía.
      # Poner el mismo valor que SPRING_DATASOURCE_PASSWORD.
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # URL pública del servicio frontend (completar tras el primer deploy de ambos)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLINIC_NOMBRE
        value: Consultorio Demo
      - key: CLINIC_TAGLINE
        value: Cuidado dental profesional para toda la familia
      - key: CLINIC_DIRECCION
        value: Av. Demo 1234
      - key: CLINIC_CIUDAD
        value: Montevideo, Uruguay
      - key: CLINIC_HORARIO
        value: Lunes a Viernes 09:00 - 18:00
      - key: CLINIC_TELEFONO
        value: "+59890000000"
      - key: CLINIC_WHATSAPP
        value: "59890000000"
      - key: CLINIC_EMAIL
        value: demo@example.com

  - type: web
    name: consultorio-odontologico-demo-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile.render
    dockerContext: ./frontend
    plan: free
