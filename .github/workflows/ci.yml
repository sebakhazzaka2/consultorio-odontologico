name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ─────────────────────────────────────────────
  # Paso 1: Compilar y testear backend
  # Tests contra H2 en memoria — no requiere MySQL.
  # ─────────────────────────────────────────────
  backend-test:
    name: Backend — compile & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Compile & test
        working-directory: backend
        run: mvn verify -B --no-transfer-progress

  # ─────────────────────────────────────────────
  # Paso 2 y 3: Build y push imágenes a GHCR
  # Push solo en merge a main; en PRs solo buildea.
  # ─────────────────────────────────────────────
  docker-backend:
    name: Docker — backend image
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/consultorio-backend:latest
            ghcr.io/${{ github.repository_owner }}/consultorio-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-frontend:
    name: Docker — frontend image
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/consultorio-frontend:latest
            ghcr.io/${{ github.repository_owner }}/consultorio-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # Paso 4: Deploy vía SSH, una vez por instancia (cliente)
  # Solo corre en merge a main, después de ambos pushes.
  #
  # Cada instancia es un GitHub Environment (Settings → Environments) con:
  #   secrets:  DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
  #   variable: DEPLOY_PATH (opcional, default /home/sebastian/consultorio-odontologico)
  # Las instancias salen de la variable de repo DEPLOY_INSTANCES (JSON, ej.
  # ["neodental","guille"]); sin definir → solo "neodental".
  # Secret de repo: GHCR_TOKEN = GitHub PAT con scope read:packages (para que el server pueda pullear).
  # El server levanta la imagen exacta de este commit (IMAGE_TAG = github.sha), no :latest.
  # fail-fast: false → si un host falla, los demás siguen.
  # Alta de instancias y rollback por SHA: docs/DEPLOY.md.
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy — ${{ matrix.instance }}
    runs-on: ubuntu-latest
    needs: [docker-backend, docker-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        instance: ${{ fromJSON(vars.DEPLOY_INSTANCES || '["neodental"]') }}
    environment: ${{ matrix.instance }}
    # Un deploy a la vez por instancia: dos merges seguidos no se pisan ni
    # terminan en desorden (eso dejaría corriendo la imagen más vieja).
    concurrency:
      group: deploy-${{ matrix.instance }}
      cancel-in-progress: false

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/sebastian/consultorio-odontologico' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG,DEPLOY_PATH
          script: |
            set -e
            # ssh-action ya exporta las envs; lo repetimos para que docker compose
            # vea IMAGE_TAG sin depender de cómo la acción las pasa.
            export IMAGE_TAG
            echo "[deploy] imagen ${IMAGE_TAG} en ${DEPLOY_PATH}"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd "$DEPLOY_PATH"
            # reset --hard (no pull): el deploy es idempotente y nunca falla por
            # cambios locales sin commitear en el working tree del server.
            # .env.prod es gitignored y backups/ es untracked → no se tocan.
            git fetch origin main
            git reset --hard origin/main
            docker compose --env-file .env.prod -f docker-compose.prod.yml pull backend frontend
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --no-build
            # De acá en adelante es limpieza: nada corta el deploy (ya está arriba).
            # :latest local = imagen recién desplegada, así un `docker compose up -d`
            # manual sin IMAGE_TAG no vuelve sin querer a una imagen vieja.
            GHCR_IMAGE_PREFIX=$(grep '^GHCR_IMAGE_PREFIX=' .env.prod | cut -d'=' -f2- || true)
            for svc in backend frontend; do
              docker tag "${GHCR_IMAGE_PREFIX}/consultorio-${svc}:${IMAGE_TAG}" "${GHCR_IMAGE_PREFIX}/consultorio-${svc}:latest" \
                || echo "[deploy] ADVERTENCIA: no se pudo retaggear ${svc} como :latest" >&2
            done
            # Las imágenes con tag de SHA nunca quedan "dangling" y prune no las borra:
            # sacamos las de deploys anteriores (las que usa un container fallan y se
            # ignoran). Para un rollback se vuelven a bajar de GHCR.
            docker images --format '{{.Repository}}:{{.Tag}}' \
              | grep -E "^${GHCR_IMAGE_PREFIX}/consultorio-(backend|frontend):" \
              | grep -v -e ":${IMAGE_TAG}\$" -e ':latest$' \
              | xargs -r docker rmi >/dev/null 2>&1 || true
            docker image prune -f || true
