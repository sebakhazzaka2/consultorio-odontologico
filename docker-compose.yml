services:

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: consultorio_db
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      CLINIC_NOMBRE: ${CLINIC_NOMBRE:-}
      CLINIC_TAGLINE: ${CLINIC_TAGLINE:-}
    ports:
      - "80:80"
    depends_on:
      - backend

  # Servidor SMTP de desarrollo: captura los emails y los muestra en http://localhost:8025.
  # Sin TLS ni auth. Para usarlo desde el backend: MAIL_HOST=mailpit (dentro de este compose)
  # o MAIL_HOST=localhost (backend fuera de Docker), MAIL_PORT=1025,
  # MAIL_SMTP_AUTH=false, MAIL_STARTTLS=false, FEATURE_EMAIL_NOTIFICATIONS=true.
  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  mysql_data:
