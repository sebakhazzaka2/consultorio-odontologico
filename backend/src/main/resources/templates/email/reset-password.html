<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout.html :: layout(~{::contenido})}">
<body>
<div th:fragment="contenido">
  <p style="margin:0 0 16px;">Hola:</p>
  <p style="margin:0 0 16px;">Recibimos un pedido para restablecer la contraseña del panel de administración de
    <strong th:text="${clinica}">la clínica</strong>.</p>
  <p style="margin:0 0 16px;">
    <a th:href="${resetUrl}" th:style="'display:inline-block;padding:10px 18px;border-radius:6px;color:#ffffff;text-decoration:none;font-weight:bold;background-color:' + ${color} + ';'"
       style="display:inline-block;padding:10px 18px;">Elegir una contraseña nueva</a>
  </p>
  <p style="margin:0 0 16px;">El enlace vence en <span th:text="${minutosValidez}">30</span> minutos y se puede usar una sola vez.</p>
  <p style="margin:0;font-size:13px;color:#6b7280;">Si no lo pediste vos, ignorá este correo: tu contraseña actual sigue funcionando.</p>
</div>
</body>
</html>
