<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout.html :: layout(~{::contenido})}">
<body>
<div th:fragment="contenido">
  <p style="margin:0 0 16px;">Hola, <span th:text="${pacienteNombre}">Ana</span>:</p>
  <p style="margin:0 0 16px;">Recibimos tu solicitud de turno en <strong th:text="${clinica}">la clínica</strong>.
    Todavía <strong>no está confirmada</strong>: te vamos a escribir de nuevo cuando la confirmemos.</p>
  <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 16px;background-color:#f3f4f6;border-radius:6px;width:100%;">
    <tr><td style="padding:12px 16px;">
      <strong>Fecha:</strong> <span th:text="${fecha}">20/10/2026</span><br>
      <strong>Hora:</strong> <span th:text="${hora}">10:30</span>
      <th:block th:if="${servicio}"><br><strong>Servicio:</strong> <span th:text="${servicio}">Consulta</span></th:block>
    </td></tr>
  </table>
  <p style="margin:0;">Si necesitás cambiar algo, respondé este correo<th:block th:if="${whatsappUrl}"> o escribinos por
    <a th:href="${whatsappUrl}" th:style="'color:' + ${color} + ';'">WhatsApp</a></th:block>.</p>
</div>
</body>
</html>
