<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout.html :: layout(~{::contenido})}">
<body>
<div th:fragment="contenido">
  <p style="margin:0 0 16px;">Llegó una <strong>nueva solicitud de turno</strong> desde la página web. Está pendiente de confirmación.</p>
  <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 16px;background-color:#f3f4f6;border-radius:6px;width:100%;">
    <tr><td style="padding:12px 16px;">
      <strong>Fecha:</strong> <span th:text="${fecha}">20/10/2026</span><br>
      <strong>Hora:</strong> <span th:text="${hora}">10:30</span>
      <th:block th:if="${servicio}"><br><strong>Servicio:</strong> <span th:text="${servicio}">Consulta</span></th:block>
      <br><br>
      <strong>Paciente:</strong> <span th:text="${pacienteNombreCompleto}">Ana Pérez</span><br>
      <strong>Teléfono:</strong> <span th:text="${pacienteTelefono}">099123456</span>
      <th:block th:if="${pacienteEmail}"><br><strong>Email:</strong> <span th:text="${pacienteEmail}">ana@example.com</span></th:block>
    </td></tr>
  </table>
  <p style="margin:0 0 8px;">
    <a th:href="${adminUrl}" th:style="'display:inline-block;padding:10px 18px;border-radius:6px;color:#ffffff;text-decoration:none;font-weight:bold;background-color:' + ${color} + ';'"
       style="display:inline-block;padding:10px 18px;">Abrir la agenda</a>
  </p>
</div>
</body>
</html>
