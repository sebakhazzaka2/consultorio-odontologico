# Perfil activo por defecto (Docker lo sobreescribe con SPRING_PROFILES_ACTIVE=prod)
spring.profiles.active=local

# Puerto y base de la API
server.port=8080
server.servlet.context-path=/api

# MySQL 8 (contraseña y JWT: definir en application-local.properties o variables de entorno)
spring.datasource.url=jdbc:mysql://localhost:3306/consultorio_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# JWT (secret para firmar/verificar tokens)
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# CORS — lista separada por comas. Sobreescribir por perfil o variable de entorno.
app.cors.allowed-origins=http://localhost:4200

# Admin seed — en local usa valores de application-local.properties
app.admin.email=admin@local.dev
app.admin.password=admin123

# Flyway — baseline-on-migrate permite adoptar una DB existente sin re-ejecutar V1
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

logging.level.org.springframework=DEBUG
logging.level.com.consultorio=DEBUG

# Sentry — deshabilitado si SENTRY_DSN no está seteado (default vacío)
sentry.dsn=${SENTRY_DSN:}

# Uploads — directorio donde se guardan las imágenes subidas
app.uploads.dir=./uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Datos de la clinica — sin defaults de cliente. NOMBRE, DIRECCION, TELEFONO,
# WHATSAPP y EMAIL son obligatorias en prod (StartupEnvValidator falla si faltan)
clinic.nombre=${CLINIC_NOMBRE:}
clinic.tagline=${CLINIC_TAGLINE:}
clinic.direccion=${CLINIC_DIRECCION:}
clinic.ciudad=${CLINIC_CIUDAD:}
clinic.horario=${CLINIC_HORARIO:Lunes a Viernes 09:00 - 18:00}
clinic.telefono=${CLINIC_TELEFONO:}
clinic.whatsapp=${CLINIC_WHATSAPP:}
clinic.email=${CLINIC_EMAIL:}
clinic.nosotros=${CLINIC_NOSOTROS:}
clinic.hero-eyebrow=${CLINIC_HERO_EYEBROW:}
clinic.label-servicio-plural=${CLINIC_LABEL_SERVICIO_PLURAL:}
clinic.google-place-id=${GOOGLE_PLACE_ID:}
clinic.stats-pacientes=${CLINIC_STATS_PACIENTES:}
clinic.stats-anos-experiencia=${CLINIC_STATS_ANOS_EXPERIENCIA:}
clinic.stats-calificacion=${CLINIC_STATS_CALIFICACION:}
# Codigo de pais de la instancia: 598 (Uruguay) o 55 (Brasil). Default 598. Validado en todos los perfiles.
clinic.country=${CLINIC_COUNTRY:598}

# Branding por instancia (opcional; vacio = look por defecto). Validado al arrancar en todos los perfiles.
clinic.branding.primary=${BRAND_PRIMARY:}
clinic.branding.primary-hover=${BRAND_PRIMARY_HOVER:}
clinic.branding.accent=${BRAND_ACCENT:}
clinic.branding.logo-url=${BRAND_LOGO_URL:}

# Zona horaria de la clinica (IANA). Las citas se guardan en hora local de la clinica y la
# JVM de prod corre en UTC: todo "ahora" de codigo nuevo sale del bean Clock con esta zona.
# Validada al arrancar en todos los perfiles.
clinic.timezone=${CLINIC_TIMEZONE:America/Montevideo}

# Feature flags (ver ClinicProperties.Flags). Apagado = no se encola ningun email a pacientes ni a la clinica.
clinic.flags.email-notifications=${FEATURE_EMAIL_NOTIFICATIONS:false}

# Email (F2a) — SMTP (Brevo por defecto). Para Mailpit local:
# MAIL_HOST=localhost MAIL_PORT=1025 MAIL_SMTP_AUTH=false MAIL_STARTTLS=false (sin usuario/clave).
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Remitente unico verificado en Brevo; el nombre visible es CLINIC_NOMBRE y el Reply-To CLINIC_EMAIL.
notifications.mail-from=${MAIL_FROM:turnos@turnosuy.com}
# Base de los links y del logo en los mails. Vacio = https://${DOMAIN}; sin DOMAIN = http://localhost:4200.
notifications.base-url=${APP_BASE_URL:}
notifications.domain=${DOMAIN:}
notifications.dispatch-delay-ms=60000

# Thymeleaf solo se usa para renderizar mails (motor propio, templates/email/): sin view resolver
# para MVC y sin chequeo de templates/ al arrancar. La API sigue siendo solo JSON.
spring.thymeleaf.enabled=false
spring.thymeleaf.check-template-location=false

# Google Places API — clave del servidor, nunca exponer al frontend
# Definir en application-local.properties o en .env
google.places.api-key=${GOOGLE_PLACES_API_KEY:}

# Seed de datos ficticios (servicios/pacientes/citas de ejemplo) — solo para
# instancias demo (Render), nunca en clientes reales. Default false.
app.seed-demo-data=${SEED_DEMO_DATA:false}
