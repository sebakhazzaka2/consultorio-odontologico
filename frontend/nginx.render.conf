# Nginx para la instancia demo en Render.
# A diferencia de nginx.conf (producción real), acá no hay proxy /api: el frontend
# llama directo al origen público del backend Render (ver environment.demo.ts).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA — rutas desconocidas redirigen a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
